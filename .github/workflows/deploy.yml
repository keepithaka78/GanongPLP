name: Deploy to AWS EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Deploy to EC2
      env:
        PRIVATE_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
        HOST: ${{ secrets.EC2_HOST }}
        USER: ${{ secrets.EC2_USER }}
      run: |
        # SSH 키 설정
        mkdir -p ~/.ssh
        echo "$PRIVATE_KEY" > ~/.ssh/deploy_key.pem
        chmod 600 ~/.ssh/deploy_key.pem

        # SSH 호스트 키 추가
        ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

        # 배포 스크립트 실행
        ssh -i ~/.ssh/deploy_key.pem "$USER@$HOST" 'bash -s' < deploy.sh

    - name: Notify Success
      if: success()
      run: echo "✅ 배포가 성공적으로 완료되었습니다!"

    - name: Notify Failure
      if: failure()
      run: echo "❌ 배포가 실패했습니다. SSH 로그를 확인하세요."
