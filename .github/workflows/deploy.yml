# GitHub Actions 자동 배포 설정
#
# 설정 방법:
# 1. GitHub Secrets 추가 (Settings → Secrets and variables → Actions)
#    - EC2_PRIVATE_KEY: SSH 키 파일 전체 내용
#    - EC2_HOST: 13.236.3.48
#    - EC2_USER: ubuntu
#
# 2. git push origin main 실행하면 자동 배포 시작
#
# 현재 상태: 비활성화 (수동 배포 사용 중)
# 자동 배포를 활성화하려면 아래 설정을 해제하세요

name: Deploy to AWS EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Deploy to EC2
      if: ${{ secrets.EC2_PRIVATE_KEY != '' && secrets.EC2_HOST != '' }}
      env:
        PRIVATE_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
        HOST: ${{ secrets.EC2_HOST }}
        USER: ${{ secrets.EC2_USER }}
      run: |
        mkdir -p ~/.ssh
        echo "$PRIVATE_KEY" > ~/.ssh/deploy_key.pem
        chmod 600 ~/.ssh/deploy_key.pem
        ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
        ssh -i ~/.ssh/deploy_key.pem "$USER@$HOST" 'bash -s' < deploy.sh

    - name: Waiting for Manual Deploy
      if: ${{ secrets.EC2_PRIVATE_KEY == '' || secrets.EC2_HOST == '' }}
      run: |
        echo "⏳ GitHub Actions 자동 배포가 아직 설정되지 않았습니다."
        echo "📖 MANUAL_DEPLOY.md를 참고하여 수동으로 배포하세요."
        echo ""
        echo "자동 배포를 설정하려면:"
        echo "1. GitHub Secrets 추가 (Settings → Secrets and variables → Actions)"
        echo "2. EC2_PRIVATE_KEY, EC2_HOST, EC2_USER 설정"
